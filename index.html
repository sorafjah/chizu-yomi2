<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>地図の読み取り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#eef6fd;color:#1c2733;
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans CJK JP",sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
rt{font-size:.5em;font-weight:400}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.screen{display:none;position:absolute;inset:0;flex-direction:column}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* スタート */
#start{align-items:center;padding:16px}
#start .inner{width:100%;max-width:760px;margin:auto;text-align:center}
h1{font-size:clamp(28px,5vw,44px);margin:8px 0 6px;color:#1f5fa8;line-height:1.9}
.lead{font-size:20px;margin:6px 0 14px;line-height:2}
.genres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.genres{grid-template-columns:repeat(2,1fr)}}
.gbtn{min-height:92px;border:3px solid #2f7dd1;border-radius:16px;background:#fff;font-size:24px;font-weight:700;line-height:1.9;padding:6px}
.gbtn small{display:block;font-size:14px;font-weight:400;color:#49627c;line-height:1.9}
.gbtn:active{background:#dcecfb}
.gbtn.any{border-color:#f08c00;background:#fff8e6}
.startfoot{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:16px;font-size:18px}
.gear{width:52px;height:52px;border-radius:50%;border:2px solid #7a8ea3;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.gear svg{width:30px;height:30px}

/* プレイ */
#bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 10px;background:#2f7dd1;color:#fff}
#bar .ttl{font-weight:700;font-size:18px;flex:1;line-height:1.6;padding-top:8px}
#bar .prog{font-size:18px;font-weight:700}
#bar button{min-width:76px;min-height:44px;border-radius:10px;border:2px solid #fff;background:transparent;color:#fff;font-size:16px;line-height:1.8}
#main{flex:1;display:flex;min-height:0}
#mapWrap{flex:1.7;min-width:0;min-height:0;padding:8px;display:flex}
#mapWrap svg{width:100%;height:100%;background:#fff;border-radius:10px;border:2px solid #b9c9d9}
#panel{flex:1;min-width:300px;padding:10px 12px 16px;background:#fff;border-left:2px solid #c8d8e8}
@media (max-aspect-ratio:1/1){
  #main{flex-direction:column}
  #mapWrap{flex:0 0 54%}
  #panel{border-left:none;border-top:2px solid #c8d8e8;min-width:0}
}
.qno{font-size:15px;color:#fff;background:#f08c00;display:inline-block;border-radius:8px;padding:0 12px;font-weight:700;line-height:1.9}
.qtext{font-size:20px;line-height:2.25;margin:6px 0 10px;font-weight:700}
.story{font-size:18px;line-height:2.3;background:#f3f8fd;border:2px solid #c8d8e8;border-radius:10px;padding:6px 10px;margin:0 0 10px;font-weight:400}
.choices{display:grid;gap:9px}
.choices.two{grid-template-columns:1fr 1fr}
.cbtn{min-height:52px;border:2.5px solid #2f7dd1;border-radius:12px;background:#fff;font-size:19px;line-height:2;padding:2px 10px;text-align:left;display:flex;align-items:center;gap:8px}
.cbtn.center{justify-content:center;text-align:center}
.cbtn.sel{background:#2f7dd1;color:#fff}
.cbtn.ok{background:#e3f6e6;border-color:#2b8a3e;color:#1c2733}
.cbtn.ng{background:#f1f3f5;border-color:#adb5bd;color:#6b7785}
.cbtn:disabled{cursor:default}
.cbtn svg{flex:0 0 auto}
.numrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.numrow input{width:96px;height:56px;font-size:28px;text-align:center;border:2.5px solid #2f7dd1;border-radius:10px;font-family:inherit;-webkit-user-select:text;user-select:text}
.numrow .unit{font-size:22px;font-weight:700}
.step{width:56px;height:56px;border-radius:12px;border:2.5px solid #2f7dd1;background:#fff;font-size:24px;padding:0}
.go{display:block;width:100%;min-height:54px;margin-top:10px;border:none;border-radius:12px;background:#f08c00;color:#fff;font-size:21px;font-weight:700;line-height:1.9}
.go:disabled{background:#cfd6dd}
.cloze{font-size:18px;line-height:3.3;font-weight:400}
.pair{display:inline-flex;gap:4px;vertical-align:middle;margin:0 3px}
.pair button{min-width:56px;min-height:44px;border:2.5px solid #2f7dd1;border-radius:10px;background:#fff;font-size:17px;line-height:1.9;padding:0 8px}
.pair button.sel{background:#2f7dd1;color:#fff}
.pair button.ok{background:#e3f6e6;border-color:#2b8a3e;color:#1c2733}
.pair button.ng{background:#f1f3f5;border-color:#adb5bd;color:#6b7785}
.fb{margin-top:12px;border-radius:12px;padding:8px 12px;font-size:18px;line-height:2.2}
.fb.ok{background:#e3f6e6;border:2.5px solid #2b8a3e}
.fb.ng{background:#fff4dc;border:2.5px solid #f08c00}
.fb .head{font-size:24px;font-weight:700}
.fb .ans{font-weight:700}

/* けっか */
#result{align-items:center;padding:16px}
#result .inner{width:100%;max-width:620px;margin:auto;text-align:center;background:#fff;border-radius:18px;border:2px solid #c8d8e8;padding:16px}
.score{font-size:30px;font-weight:700;color:#1f5fa8;line-height:2}
.rlist{list-style:none;padding:0;margin:8px 0 14px;font-size:19px;line-height:2.1;text-align:left;display:inline-block}
.rlist b{display:inline-block;width:5.5em}
.rbtns{display:grid;gap:10px}
.rbtns button{min-height:56px;border-radius:12px;font-size:20px;font-weight:700;line-height:1.9}
.b1{border:none;background:#f08c00;color:#fff}
.b2{border:2.5px solid #2f7dd1;background:#fff}

/* 設定 */
#modal{display:none;position:fixed;inset:0;background:rgba(20,40,60,.45);align-items:center;justify-content:center;padding:14px;z-index:10}
#modal.on{display:flex}
.box{background:#fff;border-radius:16px;padding:16px 18px;width:100%;max-width:460px;font-size:18px}
.box h2{margin:0 0 6px;font-size:22px;color:#1f5fa8}
.row{margin:10px 0}
.row .lab{font-weight:700;margin-bottom:4px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:48px;border:2.5px solid #2f7dd1;border-radius:10px;background:#fff;font-size:18px}
.seg button.sel{background:#2f7dd1;color:#fff}
.hint{font-size:14px;color:#49627c;line-height:1.6;margin-top:4px}
</style>
</head>
<body>

<div id="start" class="screen on scroll"><div class="inner" id="startInner"></div></div>

<div id="play" class="screen">
  <div id="bar"><div class="ttl" id="barTtl"></div><div class="prog" id="prog"></div><button id="quit"></button></div>
  <div id="main">
    <div id="mapWrap"></div>
    <div id="panel" class="scroll"></div>
  </div>
</div>

<div id="result" class="screen scroll"><div class="inner" id="resultInner"></div></div>

<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
'use strict';
/* ================= 共通 ================= */
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const ri=(a,b)=>a+rnd(b-a+1);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const rb=s=>String(s).replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const plain=s=>String(s).replace(/\{([^|}]+)\|([^}]+)\}/g,'$1');
const cross=(v,w)=>v[0]*w[1]-v[1]*w[0];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function bearing(a,b){return (Math.atan2(b.x-a.x,-(b.y-a.y))*180/Math.PI+360)%360;}
function angDiff(a,b){const d=Math.abs(a-b)%360;return d>180?360-d:d;}
const DIR8=[['{北|きた}',0],['{北東|ほくとう}',45],['{東|ひがし}',90],['{南東|なんとう}',135],['{南|みなみ}',180],['{南西|なんせい}',225],['{西|にし}',270],['{北西|ほくせい}',315]];
const R_={L:'{左|ひだり}',R:'{右|みぎ}'};
const T={
  bs:'バス{停|てい}', susumu:'{進|すす}む{向|む}き', gawa:'{側|がわ}', miete:'{見|み}て', houkou:'{方向|ほうこう}',
  ichiban:'{一番|いちばん}', chikai:'{近|ちか}い', kousaten:'{交差点|こうさてん}', magaru:'{曲|ま}がる',
  nan:'{何|なん}', kasho:'か{所|しょ}', ie:'{家|いえ}', eki:'{駅|えき}', yaku:'{約|やく}', chizu:'{地図|ちず}'
};
function compassOf(v){return v[1]<0?0:v[0]>0?2:v[1]>0?4:6;}

/* ---- SVG 文字（ふりがなつき） ---- */
function parseR(s){const out=[];const re=/\{([^|}]+)\|([^}]+)\}/g;let last=0,m;
  while((m=re.exec(s))){if(m.index>last)out.push({b:s.slice(last,m.index)});out.push({b:m[1],r:m[2]});last=re.lastIndex;}
  if(last<s.length)out.push({b:s.slice(last)});return out;}
function tw(str,size){let w=0;for(const c of str)w+=(c.charCodeAt(0)<128?0.58:1);return w*size;}
function textW(s,size){let W=0;for(const g of parseR(s))W+=Math.max(tw(g.b,size),g.r?tw(g.r,size*0.5)+1:0);return W;}
function svgT(s,x,y,o){o=o||{};const size=o.size||15,rs=size*0.5,an=o.anchor||'start';const sg=parseR(s);let W=0;
  sg.forEach(g=>{g.w=Math.max(tw(g.b,size),g.r?tw(g.r,rs)+1:0);W+=g.w;});
  let cx=an==='middle'?x-W/2:an==='end'?x-W:x;let h='';
  const halo=o.halo===false?'':' stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round"';
  const fill=o.fill||'#111',fw=o.bold?' font-weight="700"':'';
  for(const g of sg){const mx=(cx+g.w/2).toFixed(1);
    h+='<text x="'+mx+'" y="'+y+'" font-size="'+size+'" text-anchor="middle" fill="'+fill+'"'+fw+halo+'>'+g.b+'</text>';
    if(g.r)h+='<text x="'+mx+'" y="'+(y-size*0.98).toFixed(1)+'" font-size="'+rs+'" text-anchor="middle" fill="'+fill+'"'+halo+'>'+g.r+'</text>';
    cx+=g.w;}
  return h;}
function arrowHead(x,y,v,s,fill){const n=Math.hypot(v[0],v[1])||1,ux=v[0]/n,uy=v[1]/n,px=-uy,py=ux;s=s||8;
  return '<polygon points="'+(x+ux*s)+','+(y+uy*s)+' '+(x-ux*s*0.6+px*s*0.7)+','+(y-uy*s*0.6+py*s*0.7)+' '+(x-ux*s*0.6-px*s*0.7)+','+(y-uy*s*0.6-py*s*0.7)+'" fill="'+(fill||'#111')+'"/>';}
function northMark(x,y){return '<g stroke="#111" stroke-width="2.5" fill="none" stroke-linejoin="round"><path d="M'+x+' '+(y+44)+' L'+x+' '+y+' L'+(x-12)+' '+(y+26)+' L'+(x+12)+' '+(y+26)+'"/></g><text x="'+x+'" y="'+(y-5)+'" font-size="13" text-anchor="middle" font-weight="700">N</text>';}
function scaleBar(x,y){let h='<g stroke="#111" stroke-width="1.5"><line x1="'+x+'" y1="'+y+'" x2="'+(x+200)+'" y2="'+y+'"/>';
  for(let k=0;k<=5;k++)h+='<line x1="'+(x+k*40)+'" y1="'+(y-7)+'" x2="'+(x+k*40)+'" y2="'+y+'"/>';
  return h+'</g><text x="'+x+'" y="'+(y-12)+'" font-size="12" text-anchor="middle">0</text><text x="'+(x+200)+'" y="'+(y-12)+'" font-size="12" text-anchor="middle">500m</text>';}

/* ---- 解説用の重ね描き ---- */
const OV='#e8590c';
const ovRing=(p,r)=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(r||20)+'" fill="none" stroke="'+OV+'" stroke-width="4"/>';
const ovLine=(a,b,dash)=>'<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+OV+'" stroke-width="3"'+(dash?' stroke-dasharray="6 5"':'')+'/>';
const ovText=(x,y,s,size)=>'<text x="'+x+'" y="'+y+'" font-size="'+(size||17)+'" font-weight="700" text-anchor="middle" fill="'+OV+'" stroke="#fff" stroke-width="4" paint-order="stroke">'+s+'</text>';
const ovBadge=(x,y,s)=>'<circle cx="'+x+'" cy="'+y+'" r="13" fill="'+OV+'"/><text x="'+x+'" y="'+(y+6)+'" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">'+s+'</text>';
function ovPath(pts){let h='<polyline points="'+pts.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="'+OV+'" stroke-width="7" stroke-opacity=".55" stroke-linecap="round" stroke-linejoin="round"/>';
  const a=pts[pts.length-2],b=pts[pts.length-1];return h+arrowHead(b.x,b.y,[b.x-a.x,b.y-a.y],13,OV);}
function ovCompass(p,eight){let h='';const L=62;
  DIR8.forEach((d,k)=>{if(!eight&&k%2)return;const a=d[1]*Math.PI/180,x=p.x+Math.sin(a)*L,y=p.y-Math.cos(a)*L;
    h+=ovLine(p,{x:x,y:y},true)+ovText(p.x+Math.sin(a)*(L+16),p.y-Math.cos(a)*(L+16)+5,plain(d[0]),13);});
  return h;}

/* ================= 町の地図（共通モデル） ================= */
const XS=[160,320,480,640],YS=[150,300,450],MW=800,MH=600,MPP=2.5;
const QV=[[-1,-1],[1,-1],[-1,1],[1,1]];
const FAC=[['{市役所|しやくしょ}','city'],['{図書館|としょかん}','lib'],['{病院|びょういん}','hosp'],['{警察署|けいさつしょ}','police'],
 ['{消防署|しょうぼうしょ}','fire'],['{銀行|ぎんこう}','bank'],['{博物館|はくぶつかん}','museum'],['{体育館|たいいくかん}','gym'],
 ['{保健所|ほけんじょ}','health'],['{美術館|びじゅつかん}','art'],['{公民館|こうみんかん}','hall'],['スーパー','super'],
 ['{交番|こうばん}','koban'],['{神社|じんじゃ}','shrine'],['プール','pool'],['{本屋|ほんや}','book'],['{薬局|やっきょく}','pharm'],
 ['{中学校|ちゅうがっこう}','jhs'],['{高校|こうこう}','hs'],['{動物園|どうぶつえん}','zoo'],['{郵便局|ゆうびんきょく}','post'],
 ['{公園|こうえん}','park'],['{小学校|しょうがっこう}','es'],['{花屋|はなや}','flower'],['パン{屋|や}','bakery']];
const MULTI=[['{郵便局|ゆうびんきょく}','post'],['{公園|こうえん}','park'],['{小学校|しょうがっこう}','es']];
const PREF=['あおば','みどり','ひかり','さくら','わかば','いずみ','もみじ','つばめ','かえで','ひばり'];
const AREA=['{山下|やました}','{川上|かわかみ}','{池田|いけだ}','{森本|もりもと}','{本町|ほんまち}','{中町|なかまち}','{大通|おおどお}り','{坂下|さかした}','{谷口|たにぐち}','{松原|まつばら}'];
const STN=['あさがお','ひまわり','すみれ','こすもす','つつじ','もくれん','なのはな','たんぽぽ','あじさい'];
const PEOPLE=['ゆうき','はるか','そうた','みさき','けんと','あやか'];

function newTown(kind){return {kind:kind,fac:[],spot:new Set(),occ:new Set(),pool:shuffle(FAC),sym:false};}
function spotPos(t,i,j,q){const dx=t.sym?27:22,dy=27;return {x:XS[i]+QV[q][0]*dx,y:YS[j]+QV[q][1]*dy};}
function rowKey(i,j,q){return (i+(QV[q][0]>0?1:0))+','+(j+(QV[q][1]>0?1:0))+','+(QV[q][1]>0?'T':'B');}
function canPlace(t,i,j,q){return !t.spot.has(i+','+j+','+q)&&(t.sym||!t.occ.has(rowKey(i,j,q)));}
function reserve(t,i,j,q){t.spot.add(i+','+j+','+q);if(!t.sym)t.occ.add(rowKey(i,j,q));}
function place(t,i,j,q,name,cat){if(!canPlace(t,i,j,q))return null;const p=spotPos(t,i,j,q);
  const f={id:t.fac.length,name:name,cat:cat,i:i,j:j,q:q,x:p.x,y:p.y};t.fac.push(f);reserve(t,i,j,q);return f;}
function freeSpots(t){const r=[];for(let i=0;i<4;i++)for(let j=0;j<3;j++)for(let q=0;q<4;q++)if(canPlace(t,i,j,q))r.push([i,j,q]);return shuffle(r);}
function takeUnique(t,exclude){for(let k=0;k<t.pool.length;k++){if(exclude&&exclude.indexOf(t.pool[k][1])>=0)continue;return t.pool.splice(k,1)[0];}return null;}
function placeUniqueAt(t,cands,exclude){for(const c of shuffle(cands)){if(canPlace(t,c[0],c[1],c[2])){const u=takeUnique(t,exclude);if(!u)return null;return place(t,c[0],c[1],c[2],u[0],u[1]);}}return null;}
function fill(t,total,exclude){let guard=0;while(t.fac.length<total&&guard++<80){const fs=freeSpots(t);if(!fs.length)break;const u=takeUnique(t,exclude);if(!u)break;place(t,fs[0][0],fs[0][1],fs[0][2],u[0],u[1]);}}
function facAt(t,i,j){return t.fac.filter(f=>f.i===i&&f.j===j);}
const nodeXY=n=>({x:XS[n[0]],y:YS[n[1]]});

/* ---- 方位の問題（どの地図でも使う） ---- */
function qDir(anchors,targets,eight,overlayR){
  const tolC=eight?13:22,tolD=eight?40:58;
  for(const a of shuffle(anchors)){
    for(let k of shuffle([0,1,2,3,4,5,6,7])){
      if(!eight&&k%2)continue;
      const cands=targets.filter(f=>f!==a&&f.name!==a.name&&dist(a,f)>=95);
      const corr=cands.filter(f=>angDiff(bearing(a,f),DIR8[k][1])<=tolC);
      const dis=cands.filter(f=>angDiff(bearing(a,f),DIR8[k][1])>=tolD);
      if(corr.length&&dis.length>=3){
        const c=pick(corr),ch=shuffle([c].concat(shuffle(dis).slice(0,3)));
        return {type:'choice',text:a.name+'から'+T.miete+'、'+DIR8[k][0]+'の'+T.houkou+'にあるのは どれかな？',
          choices:ch.map(f=>f.name),answer:ch.indexOf(c),
          explain:T.chizu+'の{上|うえ}が{北|きた}だよ。'+a.name+'から'+DIR8[k][0]+'の'+T.houkou+'を{見|み}ると、'+c.name+'があるよ。',
          overlay:ovCompass(a,eight)+ovRing(c,overlayR||18)};
      }
    }
  }
  return null;
}

/* ================= バス・あんない板 ================= */
function genBus(level,board){
  const t=newTown(board?'board':'bus');
  const railTop=rnd(2)===0;t.rail={top:railTop,y:railTop?26:574};
  const shapes=level===1?[[2,1],[2,2]]:level===2?[[3,1],[2,2],[3,2]]:[[2,2],[3,2],[3,2]];
  const sh=pick(shapes),w=sh[0],h=sh[1];
  const i0=rnd(4-w),i1=i0+w,j0=h===2?0:(railTop?0:1),j1=j0+h;
  let nodes=[];
  for(let i=i0;i<i1;i++)nodes.push([i,j0]);for(let j=j0;j<j1;j++)nodes.push([i1,j]);
  for(let i=i1;i>i0;i--)nodes.push([i,j1]);for(let j=j1;j>j0;j--)nodes.push([i0,j]);
  let N=nodes.length;const railJ=railTop?0:2;
  if(level>=2&&w>=2&&h>=2&&rnd(2)){
    const cs=[];
    for(let k=0;k<N;k++){const P=nodes[(k+N-1)%N],C=nodes[k],Q=nodes[(k+1)%N];
      if(P[0]!==Q[0]&&P[1]!==Q[1]){const D=[P[0]+Q[0]-C[0],P[1]+Q[1]-C[1]];
        if(!nodes.some(n=>n[0]===D[0]&&n[1]===D[1]))cs.push([k,D]);}}
    if(cs.length){const c=pick(cs);nodes[c[0]]=c[1];}
  }
  if(rnd(2))nodes.reverse();
  const railEdges=[];for(let k=0;k<N;k++){const a=nodes[k],b=nodes[(k+1)%N];if(a[1]===railJ&&b[1]===railJ)railEdges.push(k);}

function renderPark(p){

  h+='<defs><pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9aa3ad"/></pattern></defs>';

  p.zones.forEach(z=>{h+='<ellipse cx="'+z.x+'" cy="'+z.y+'" rx="'+z.rx+'" ry="'+z.ry+'" fill="url(#dots)" stroke="'+(z.pond?'#111':'#8b949e')+'" stroke-width="'+(z.pond?1.5:1)+'"/>'+svgT(z.name,z.x,z.y+6,{size:14,anchor:'middle'});});
  const N=p.nodes.length;

    s+=arrowHead(u.x+(w.x-u.x)*0.72,u.y+(w.y-u.y)*0.72,[w.x-u.x,w.y-u.y],9);
    const mx=(u.x+w.x)/2,my=(u.y+w.y)/2,d=Math.hypot(mx-p.cx,my-p.cy)||1,lx=mx+(mx-p.cx)/d*25,ly=my+(my-p.cy)/d*25;
    s+=isA?'<rect x="'+(lx-12)+'" y="'+(ly-12)+'" width="24" height="24" fill="#fff" stroke="#111" stroke-width="2"/>':'<circle cx="'+lx+'" cy="'+ly+'" r="13" fill="#fff" stroke="#111" stroke-width="2"/>';
    return s+'<text x="'+lx+'" y="'+(ly+5.5)+'" font-size="15" font-weight="700" text-anchor="middle">'+time+'</text>';};
  for(let k=0;k<p.a;k++)h+=seg(p.nodes[k],p.nodes[k+1],p.tA[k],true);
  for(let m=0;m<p.b;m++)h+=seg(p.nodes[(N-m)%N],p.nodes[N-m-1],p.tB[m],false);
  p.clusters.forEach(c=>{const n=c.icons.length;c.icons.forEach((k,i)=>{h+=iconSvg(k,c.x+(i-(n-1)/2)*23,c.y);});});
  // ★ と あ
  let st='';for(let k=0;k<10;k++){const r=k%2?7:17,a=Math.PI*k/5;st+=(p.star.x+r*Math.sin(a)).toFixed(1)+','+(p.star.y-r*Math.cos(a)).toFixed(1)+' ';}

  h+=northMark(752,96);
  // はんれい
  const y0=PH;let lg='';
  ICONS.forEach((ic,k)=>{const x=40+(k%3)*250,y=y0+30+Math.floor(k/3)*36;lg+=iconSvg(ic[1],x,y)+svgT(ic[0],x+20,y+5,{size:14,halo:false});});
  const yy=y0+106;
  lg+=svgT('Aコース',30,yy+5,{size:14,bold:true,halo:false})+'<line x1="92" y1="'+yy+'" x2="140" y2="'+yy+'" stroke="#111" stroke-width="2.8"/>'+arrowHead(148,yy,[1,0],8)+'<rect x="164" y="'+(yy-10)+'" width="20" height="20" fill="#fff" stroke="#111" stroke-width="2"/>'+svgT('の{数字|すうじ}（分）',190,yy+5,{size:14,halo:false});

/* ================= 1回ぶんの問題を作る ================= */
const GENRES=[
  {id:'bus',name:'バス',sub:'バス{停|てい}と{進|すす}む{向|む}き'},
  {id:'board',name:'あんない{板|ばん}',sub:'バスの{時間|じかん}と{行|い}き{方|かた}'},
  {id:'route',name:'{道|みち}じゅん',sub:'{歩|ある}いた{道|みち}をさがす'},
  {id:'train',name:'{電車|でんしゃ}',sub:'{記号|きごう}と{乗|の}りかえ'},
  {id:'park',name:'{公園|こうえん}',sub:'マークとコース'}
];
function buildSession(genre,level){
  for(let tr=0;tr<400;tr++){
    let m,qs,rd;
    if(genre==='bus'){m=genBus(level,false);if(!m)continue;qs=[qNearestStop(m),qDir(m.fac,m.fac,level>=2),qAhead(m,level),qLR(m)];rd=renderTown(m);}
    else if(genre==='board'){m=genBus(level,true);if(!m)continue;qs=[qDir(m.fac,m.fac,true),qTime(m,level),level===1?qNearestStop(m):qAhead(m,level),qCloze(m,level)];rd=renderTown(m);}
    else if(genre==='route'){m=genRoute(level);if(!m)continue;qs=[qCount(m,level),qShelter(m),qDir([m.dest].concat(m.fac),m.fac,level>=2),qRoute(m)];rd=renderTown(m);}
    else if(genre==='train'){m=genTrain(level);if(!m)continue;qs=[qDir(m.uniq,m.uniq,level>=2),qNearStation(m,level),qStatement(statementsTrain(m),level,T.chizu+'と{記号|きごう}の{表|ひょう}'),qTrainCompare(m)];rd=renderTown(m);}
    else{m=genPark(level);if(!m)continue;qs=[qParkDir(m,level),qParkCount(m),level===1?qParkSum(m):qParkStatement(m),qParkCompare(m,level)];rd=renderPark(m);}
    if(qs.some(q=>!q))continue;
    return {genre:genre,map:m,qs:qs,render:rd};
  }
  return null;
}

function save(){try{localStorage.setItem('chizuYomi2',JSON.stringify(S));}catch(e){}}
let AC=null;
function unlock(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,t0,d){try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;const t=AC.currentTime+t0;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.11,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function sfx(ok){if(!S.sound||!AC)return;if(ok){tone(660,0,0.18);tone(880,0.14,0.28);}else{tone(392,0,0.3);}}

function startGame(g){

function renderQ(){
  const q=cur.ses.qs[cur.idx],n=cur.ses.qs.length;
  $('#prog').textContent=(cur.idx+1)+' / '+n;$('#ov').innerHTML='';
  let h='<span class="qno">'+rb('もんだい '+(cur.idx+1))+'</span>';
  if(q.story)h+='<div class="story">'+rb(q.story)+'</div>';
  h+='<div class="qtext">'+rb(q.text)+'</div>';
  const numUI=()=>'<div class="numrow">'+(q.numLabel?'<span class="unit">'+rb(q.numLabel)+'</span>':'')+'<button class="step" data-d="-1" aria-label="へらす">▽</button><input id="numIn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"><span class="unit">'+rb(q.unit)+'</span><button class="step" data-d="1" aria-label="ふやす">△</button></div>';
  if(q.type==='choice'){h+='<div class="choices'+(q.two?' two':'')+'">';q.choices.forEach((c,k)=>{h+='<button class="cbtn'+(q.center?' center':'')+'" data-k="'+k+'">'+wrapC(c)+'</button>';});h+='</div>';}
  else if(q.type==='number'){h+=numUI()+'<button class="go" id="goBtn" disabled>'+rb('これで{答|こた}える')+'</button>';}
  else if(q.type==='combo'){h+='<div class="choices two">';q.opts.forEach((c,k)=>{h+='<button class="cbtn center" data-s="'+k+'"><span>'+rb(c)+'</span></button>';});h+='</div>'+numUI()+'<button class="go" id="goBtn" disabled>'+rb('これで{答|こた}える')+'</button>';}
  else if(q.type==='cloze'){h+='<div class="cloze story">';let bi=0;q.parts.forEach(p=>{if(p.t!==undefined)h+=rb(p.t);else{h+='<span class="pair" data-b="'+bi+'">'+p.opts.map((o,k)=>'<button data-o="'+k+'">'+rb(o)+'</button>').join('')+'</span>';bi++;}});
    h+='</div><button class="go" id="goBtn" disabled>'+rb('これで{答|こた}える')+'</button>';}
  h+='<div id="fb"></div>';
  const P=$('#panel');P.innerHTML=h;P.scrollTop=0;
  let done=false,sel=-1;const blanks=q.type==='cloze'?q.parts.filter(p=>p.opts):[];const csel=blanks.map(()=>-1);
  const numIn=$('#numIn'),go=$('#goBtn');
  const ready=()=>{if(!go)return;let ok=true;if(numIn)ok=/^\d+$/.test(numIn.value.trim());if(q.type==='combo')ok=ok&&sel>=0;if(q.type==='cloze')ok=csel.every(v=>v>=0);go.disabled=!ok||done;};
  if(numIn){numIn.addEventListener('input',()=>{numIn.value=numIn.value.replace(/[^0-9]/g,'');ready();});
    P.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>{if(done)return;unlock();let v=parseInt(numIn.value,10);if(isNaN(v))v=0;v=Math.max(0,Math.min(999,v+(+b.dataset.d)));numIn.value=v;ready();}));}
  const finish=(ok,ansText)=>{
    done=true;sfx(ok);cur.res.push(ok);if(go)go.disabled=true;if(numIn)numIn.disabled=true;
    $('#ov').innerHTML=q.overlay||'';
    const last=cur.idx===cur.ses.qs.length-1;
    $('#fb').innerHTML='<div class="fb '+(ok?'ok':'ng')+'"><div class="head">'+(ok?'○ せいかい！':'△ おしい！')+'</div>'+(ok?'':'<div class="ans">'+rb('{答|こた}えは「'+ansText+'」だよ。')+'</div>')+'<div>'+rb(q.explain)+'</div></div><button class="go" id="nextBtn">'+rb(last?'けっかを{見|み}る':'つぎへ')+'</button>';
    $('#nextBtn').addEventListener('click',()=>{if(last)renderResult();else{cur.idx++;renderQ();}});
    setTimeout(()=>{try{$('#nextBtn').scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}},60);
  };
  if(q.type==='choice'){P.querySelectorAll('.cbtn').forEach(b=>b.addEventListener('click',()=>{if(done)return;unlock();const k=+b.dataset.k;
    P.querySelectorAll('.cbtn').forEach(x=>{x.disabled=true;const kk=+x.dataset.k;if(kk===q.answer)x.classList.add('ok');else if(kk===k)x.classList.add('ng');});
    finish(k===q.answer,plainHtml(q.choices[q.answer]));}));}
  if(q.type==='combo'){P.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{if(done)return;unlock();sel=+b.dataset.s;P.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('sel',x===b));ready();}));}
  if(q.type==='cloze'){P.querySelectorAll('.pair').forEach(sp=>{const bi=+sp.dataset.b;sp.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(done)return;unlock();csel[bi]=+b.dataset.o;sp.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));ready();}));});}
  if(go)go.addEventListener('click',()=>{if(done)return;unlock();
    if(q.type==='number'){const v=parseInt(numIn.value,10);finish(v===q.answer,q.answer+q.unit);}
    else if(q.type==='combo'){const v=parseInt(numIn.value,10);
      P.querySelectorAll('[data-s]').forEach(x=>{x.disabled=true;const kk=+x.dataset.s;x.classList.remove('sel');if(kk===q.sel)x.classList.add('ok');else if(kk===sel)x.classList.add('ng');});
      finish(sel===q.sel&&v===q.answer,q.ansText);}
    else{let ok=true;P.querySelectorAll('.pair').forEach(sp=>{const bi=+sp.dataset.b,bl=blanks[bi];if(csel[bi]!==bl.ans)ok=false;
        sp.querySelectorAll('button').forEach(x=>{x.disabled=true;const kk=+x.dataset.o;x.classList.remove('sel');if(kk===bl.ans)x.classList.add('ok');else if(kk===csel[bi])x.classList.add('ng');});});
      finish(ok,blanks.map(b=>b.opts[b.ans].replace(/[「」]/g,'')).join('・'));}
  });
}
function wrapC(c){const m=c.match(/^(<svg[\s\S]*?<\/svg>)([\s\S]*)$/);return m?m[1]+'<span>'+rb(m[2])+'</span>':'<span>'+rb(c)+'</span>';}
function plainHtml(s){return s.replace(/<svg[\s\S]*?<\/svg>/g,'');}
function renderResult(){
  const n=cur.res.length,c=cur.res.filter(x=>x).length;
  let h='<div class="score">'+rb(n+'もん{中|ちゅう} '+c+'もん せいかい')+'</div><div class="lead">'+rb(c===n?'ぜんぶ できたね。すごい！':c>=n/2?'よく がんばったね。':'さいごまで よく がんばったね。もう1{回|かい} やってみよう。')+'</div><ul class="rlist">';
  cur.res.forEach((r,k)=>{h+='<li><b>'+rb('もんだい '+(k+1))+'</b>'+(r?'○ せいかい':'△ おしい')+'</li>';});
  h+='</ul><div class="rbtns"><button class="b1" id="again">'+rb('あたらしい{地図|ちず}で もう1{回|かい}')+'</button><button class="b2" id="home">'+rb('さいしょの{画面|がめん}に もどる')+'</button></div>';
  $('#resultInner').innerHTML=h;show('result');
  $('#again').addEventListener('click',()=>{unlock();startGame(cur.choice);});
  $('#home').addEventListener('click',()=>{renderStart();show('start');});
}
$('#quit').addEventListener('click',()=>{renderStart();show('start');});

/* ---- iPad むけ：ズームやバウンスをふせぐ ---- */
document.addEventListener('gesturestart',e=>e.preventDefault());
let lastTouch=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<300&&!e.target.closest('button,input,a')){e.preventDefault();}lastTouch=now;},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1||!e.target.closest('.scroll'))e.preventDefault();},{passive:false});
renderStart();
</script>
</body>
